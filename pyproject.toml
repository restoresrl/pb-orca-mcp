[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "pb-orca-mcp"
version = "0.2.2"
description = "MCP server exposing PowerBuilder's ORCA API (pborc.dll) as MCP tools — usable from any MCP client"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Carlo Torrese", email = "carlo.torrese@re-store.it" },
]
keywords = ["powerbuilder", "orca", "mcp", "agentic", "pb", "ctypes", "powerbuilder-ide"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    # Ceiling because `mcp` 2.0.0 removed `mcp.server.fastmcp`, which this
    # server is built on. Without it a fresh resolve picks up 2.x and the
    # process dies at startup on `ModuleNotFoundError: No module named
    # 'mcp.server.fastmcp'` — only in stdio serve mode, since `doctor` and
    # `check` never import it. Lift the ceiling together with a port to the
    # 2.x server API; a floating major on the transport layer is what broke
    # this, so re-pin rather than re-open the range.
    "mcp>=1.0,<2",
    "pydantic>=2.0",
    "click>=8.1",
    # Transitive, reached through mcp -> pyjwt[crypto]. Constrained because
    # cryptography stopped publishing 32-bit Windows wheels at 49.0, and this
    # package has to run on an x86 interpreter to load pborc.dll. Without the
    # ceiling, a fresh `uvx --python 3.12-x86` resolves the newest cryptography,
    # finds no win32 wheel, tries to build it from source and fails on the Rust
    # and OpenSSL toolchain — which made the documented install command
    # unusable on any machine without a warm cache. Revisit if upstream ships
    # win32 wheels again, or if mcp drops the pyjwt[crypto] dependency.
    "cryptography<49",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
pb-orca-mcp = "pb_orca_mcp.__main__:cli"

[project.urls]
Homepage = "https://github.com/restoresrl/pb-orca-mcp"
Documentation = "https://github.com/restoresrl/pb-orca-mcp/blob/main/docs/getting-started.md"
Issues = "https://github.com/restoresrl/pb-orca-mcp/issues"
Changelog = "https://github.com/restoresrl/pb-orca-mcp/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pb_orca_mcp"]

[tool.hatch.build.targets.sdist]
# `include` is an explicit allowlist, so files not listed here — e.g. AGENTS.md
# (agent context) — are not shipped to package users.
include = [
    "src/pb_orca_mcp",
    "tests",
    "docs",
    "skills",
    "README.md",
    "CONTRIBUTING.md",
    "CHANGELOG.md",
    "SECURITY.md",
    "CODE_OF_CONDUCT.md",
    "LICENSE",
    ".gitattributes",
    "pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "requires_pb: test requires a real PowerBuilder installation (skipped in CI)",
    "requires_orca_session: test opens a real ORCA session (single-threaded, serialized)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
